project:
  name: Hotspot Kafka API
  version: 1.0.0

server:
  port: 8080

spring:
  application:
    name: backend

  task:
    scheduling:
      pool:
        size: 4

  profiles:
    default: local

  config:
    import:
      - optional:file:.env[.properties]
      - classpath:postgres.yml
      - classpath:redis.yml
      - classpath:kafka.yml

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
