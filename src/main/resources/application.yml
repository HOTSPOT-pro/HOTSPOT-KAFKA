project:
  name: Hotspot Kafka API
  version: 1.0.0

server:
  port: 8080

spring:
  application:
    name: hotspot-worker

  task:
    scheduling:
      pool:
        size: 4

  profiles:
    default: local

  config:
    import:
      - optional:file:.env[.properties]
      - classpath:postgres.yml
      - classpath:redis.yml
      - classpath:kafka.yml

app:
  usage:
    db-writer:
      queue-capacity: 20000
      batch-size: 200
      batch-wait-ms: 200
      max-retries: 2
      paused-retry-wait-ms: 10000
      listener-id: usage-events-listener

management:
  endpoints:
    web:
      exposure:
        include: prometheus,health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

---
spring:
  config:
    activate:
      on-profile: local

logging:
  level:
    root: INFO

---
spring:
  config:
    activate:
      on-profile: dev

logging:
  level:
    root: INFO
