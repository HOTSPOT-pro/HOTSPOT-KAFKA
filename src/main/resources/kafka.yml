spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    properties:
      security.protocol: PLAINTEXT

    producer:
      acks: all
      retries: 10
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 10
        batch.size: 65536
        compression.type: snappy

    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false

    listener:
      ack-mode: manual

app:
  topics:
    usage-events: usage-events
    usage-alert-events: usage-alert-events
    family-events: family-events
    subscription-events: subscription-events

  consumer-groups:
    usage: usage-consumer-group
    alert: usage-alert-consumer-group
    family: family-consumer-group
    subscription: subscription-consumer-group

  outbox:
    usage-alerts:
      stream-key: outbox:usage-alerts:v1
      group: usage-alerts-pub-g1
      consumer-name: ${HOSTNAME:worker}:${random.uuid}
      read-count: 100
      block-ms: 2000
      poll-delay-ms: 500
      max-attempts: 20
      max-in-flight: 500
      meta-key-prefix: "outbox:meta:usage-alerts:v1:"
      meta-ttl-seconds: 1209600
      dlq-stream-key: outbox:usage-alerts:dlq:v1
      reclaim-min-idle-ms: 60000
      reclaim-batch-size: 100
      callback-executor:
        pool-size: 4
        queue-capacity: 1000
