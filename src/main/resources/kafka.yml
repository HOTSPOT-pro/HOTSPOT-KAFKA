spring:
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    properties:
      security.protocol: PLAINTEXT

    producer:
      acks: 1
      retries: 3
      properties:
        enable.idempotence: false
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 120000
        linger.ms: 20
        batch.size: 65536
        compression.type: snappy
        buffer.memory: 33554432
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest
      enable-auto-commit: false
      max-poll-records: ${KAFKA_CONSUMER_MAX_POLL_RECORDS:1000}
      properties:
        max.poll.interval.ms: ${KAFKA_CONSUMER_MAX_POLL_INTERVAL_MS:600000}
        fetch.min.bytes: ${KAFKA_CONSUMER_FETCH_MIN_BYTES:65536}
        fetch.max.wait.ms: ${KAFKA_CONSUMER_FETCH_MAX_WAIT_MS:300}

    listener:
      ack-mode: manual

app:
  topics:
    usage-events: usage-events
    user-alert-events: user-alert-events
    family-events: family-events
    subscription-events: subscription-events

  consumer-groups:
    usage: usage-consumer-group
    family: family-consumer-group
    subscription: subscription-consumer-group
